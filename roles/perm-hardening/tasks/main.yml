---
- name: Set permissions for /etc/shadow [root:root, 0600]
  ansible.builtin.file:
    path: /etc/shadow
    owner: root
    group: root
    mode: '0600'
  
- name: Set permissions for /etc/passwd [root:root, 0644]
  ansible.builtin.file:
    path: /etc/passwd
    owner: root
    group: root
    mode: '0644'

- name: Set permissions for /etc/ssh/sshd_config [root:root, 0600]
  ansible.builtin.file:
    path: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: '0600'
